name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable app
        shell: cmd
        run: build.bat nopause

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/DRAQ -DestinationPath dist/DRAQ-Portable-win-x64.zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/DRAQ.iss'

      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DRAQ-Portable-win-x64.zip
            installer/Output/DRAQ-Setup.exe

